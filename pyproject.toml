[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-db-portability"
version = "0.4.0"
description = "Catch Django code that breaks when ported to another database (postgres <-> oracle, postgres <-> mysql today), plus runtime helpers for the NULL/empty-string divergence between backends"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Rayan Mahdinejad", email = "rayan.mahdinejad@gmail.com" },
]
dependencies = [
    "flake8>=6.0",
]

[project.urls]
Homepage = "https://github.com/rayanmahdinejad/django-db-portability"
Repository = "https://github.com/rayanmahdinejad/django-db-portability"

[project.optional-dependencies]
django = ["django>=4.2"]
test = ["pytest>=7.0", "django>=4.2"]

[project.entry-points."flake8.extension"]
DBP = "db_portability.lint:PostgresPortabilityChecker"

[project.scripts]
dbp-scan = "db_portability.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
